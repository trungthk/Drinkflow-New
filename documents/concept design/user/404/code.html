<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DrinkFlow - 404 Không tìm thấy trang</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#f8f9ff] text-slate-800 font-sans antialiased min-h-full flex items-center justify-center p-4">
  <div class="max-w-md w-full text-center">
    <!-- Illustration / Graphic Card -->
    <div class="bg-white rounded-3xl p-8 border border-slate-100 shadow-xl relative overflow-hidden">
      <!-- Decorative background blur -->
      <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-100/50 rounded-full blur-2xl pointer-events-none"></div>
      
      <!-- Big Cup with Straw Illustration -->
      <div class="w-24 h-24 mx-auto mb-6 bg-slate-50 border border-slate-100 rounded-3xl flex items-center justify-center shadow-inner relative">
        <span class="text-5xl">🧋</span>
        <div class="absolute -bottom-1 -right-1 bg-amber-500 text-white font-extrabold text-[11px] px-2 py-0.5 rounded-full shadow-sm">
          Empty
        </div>
      </div>

      <div class="inline-block px-3 py-1 rounded-full bg-slate-100 text-slate-600 font-mono text-xs font-bold mb-3">
        ERROR CODE: 404
      </div>

      <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight mb-2">
        Trang hoặc Ly nước này không tồn tại!
      </h1>

      <p class="text-xs text-slate-500 leading-relaxed mb-6">
        Đường dẫn bạn vừa truy cập có thể đã hết hạn, phòng ban (Room) đã được chuyển giao hoặc đợt đặt món này đã bị đóng.
      </p>

      <div class="space-y-2.5">
        <a href="#" class="block w-full py-3 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs shadow-md shadow-slate-900/15 transition-all">
          Quay lại Workspace Hub
        </a>
        <a href="#" class="block w-full py-3 rounded-2xl bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 font-bold text-xs transition-colors">
          Xem các Chiến dịch đang mở
        </a>
      </div>
    </div>

    <!-- Micro info -->
    <p class="text-[11px] text-slate-400 mt-6">
      DrinkFlow Corporate Core • Hệ thống giám sát định danh phòng ban
    </p>
  </div>
</body>
</html>
