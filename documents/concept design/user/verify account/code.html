<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DrinkFlow - Xác thực Tài khoản vào Room</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-900/60 backdrop-blur-sm font-sans antialiased min-h-full flex items-center justify-center p-4">
  <!-- Modal Card -->
  <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl border border-slate-100 overflow-hidden animate-in fade-in zoom-in duration-200">
    <!-- Header with room preview banner -->
    <div class="bg-gradient-to-r from-blue-900 to-slate-900 p-6 text-white relative">
      <div class="flex items-center justify-between mb-4">
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300 text-[11px] font-bold uppercase tracking-wider border border-emerald-400/30">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
          Xác thực tham gia Room
        </span>
        <button class="text-slate-400 hover:text-white p-1 rounded-lg transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="flex items-center space-x-3.5">
        <div class="w-12 h-12 rounded-2xl bg-white/10 border border-white/20 flex items-center justify-center text-2xl shadow-inner">
          🏢
        </div>
        <div>
          <h3 class="font-extrabold text-lg text-white">Phòng IT Department</h3>
          <p class="text-xs text-slate-300">Tầng 4, Tòa nhà Innovation • 34 thành viên</p>
        </div>
      </div>
    </div>

    <!-- Modal Body -->
    <div class="p-6 space-y-5">
      <!-- Authenticated Global User Identity -->
      <div class="bg-slate-50 rounded-2xl p-3.5 border border-slate-100 flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <img src="https://lh3.googleusercontent.com/aida/AEtjO1UNzJSRtTOvm_yCmgGIiF_k57geL4PhhBO7akp9MzRMP5zqxilHgIS_5ZXh6byJ9gQExKnQ4TuMhrlq2x0nwv8KWovUUQqtfaMXf2aNOxeAxygj4NolHPs2xPM-I6FB-Sd2v5CGvSxh8xOgm9qY2saY-NKE_sKtO2dlpdKv8mgq9qd_a0Goj8uili80fNtiKJ5KDD-Dobm3mGfpAha1ucwUNNPfk5p3PyLYN7Q32I7gzFZACoLSA3tM0ik" alt="User Avatar" class="w-10 h-10 rounded-full object-cover border-2 border-white shadow-sm">
          <div>
            <div class="font-bold text-xs text-slate-900 flex items-center gap-1">
              Lê Hoàng Nam
              <svg class="w-3.5 h-3.5 text-blue-600" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
            </div>
            <div class="text-[11px] text-slate-500">nam.le@company.com</div>
          </div>
        </div>
        <span class="text-[10px] font-extrabold bg-blue-100 text-blue-800 px-2 py-0.5 rounded-md">
          SSO Verified
        </span>
      </div>

      <!-- User Code & Display Name Customization -->
      <div class="space-y-3.5">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Mã định danh trong Room (User Code)</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 font-bold text-xs">
              #IT-
            </div>
            <input type="text" value="104" class="w-full pl-12 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-900 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none" placeholder="104">
          </div>
          <p class="text-[10px] text-slate-400 mt-1">Dùng để phân biệt khi tổng hợp đơn và gán mã chuyển khoản VietQR tự động.</p>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Tên hiển thị gọi món trong phòng</label>
          <input type="text" value="Nam Lê (Backend Lead)" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-semibold text-slate-900 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none">
        </div>

        <!-- Trusted Device Checkbox -->
        <div class="bg-blue-50/70 border border-blue-100 rounded-2xl p-3.5">
          <label class="flex items-start space-x-2.5 cursor-pointer">
            <input type="checkbox" checked class="w-4 h-4 mt-0.5 rounded text-blue-600 border-slate-300 focus:ring-blue-500">
            <div class="text-xs">
              <span class="font-bold text-slate-900">Ghi nhớ thiết bị này (Trusted Device)</span>
              <p class="text-[11px] text-slate-500 mt-0.5 leading-relaxed">
                Tự động cấp chứng chỉ HttpOnly Cookie an toàn để mở app và đặt món nhanh chóng trong các lần sau mà không cần yêu cầu xác thực lại.
              </p>
            </div>
          </label>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="pt-2 flex items-center space-x-3">
        <button class="w-1/3 py-3 rounded-xl border border-slate-200 text-slate-600 text-xs font-bold hover:bg-slate-50 transition-colors">
          Hủy bỏ
        </button>
        <button class="w-2/3 py-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-extrabold shadow-md shadow-slate-900/20 transition-all flex items-center justify-center gap-1.5">
          <span>Xác nhận vào Room</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </button>
      </div>
    </div>
  </div>
</body>
</html>
