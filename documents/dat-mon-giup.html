<!-- TailwindCSS -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4 backdrop-blur-[2px]">

    <!-- Modal -->
    <div class="relative w-full max-w-xl overflow-hidden rounded-3xl bg-white shadow-2xl">

        <!-- Close -->
        <button
            type="button"
            class="absolute right-5 top-5 flex h-10 w-10 items-center justify-center
                   rounded-full bg-slate-100 text-slate-400 transition
                   hover:bg-slate-200 hover:text-slate-600"
            aria-label="Đóng"
        >
            <svg class="h-5 w-5" fill="none" stroke="currentColor"
                 viewBox="0 0 24 24" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M6 18 18 6M6 6l12 12"/>
            </svg>
        </button>

        <div class="px-6 pb-6 pt-8 sm:px-8">

            <!-- Header -->
            <div class="text-center">

                <!-- Icon -->
                <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center
                            rounded-2xl bg-violet-50 text-violet-600">
                    <svg class="h-8 w-8" fill="none" stroke="currentColor"
                         viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M15 19.128a9.38 9.38 0 0 0-3-.503
                                 c-1.052 0-2.062.173-3 .503
                                 M12 6.75a3 3 0 1 1-6 0
                                 3 3 0 0 1 6 0ZM6.75 21
                                 a6.75 6.75 0 0 1 13.5 0
                                 M19 7.5v6M22 10.5h-6"/>
                    </svg>
                </div>

                <h2 class="text-2xl font-bold tracking-tight text-slate-900">
                    Đặt món giúp thành viên khác
                </h2>

                <p class="mt-2 text-sm leading-6 text-slate-500 sm:text-base">
                    Nhập mã thành viên để gán món này cho họ.
                </p>
            </div>

            <!-- Form -->
            <div class="mt-7 rounded-2xl bg-slate-50 p-4 sm:p-5">

                <label
                    for="member"
                    class="mb-2 block text-sm font-semibold text-slate-700"
                >
                    Mã code, email hoặc số điện thoại thành viên
                </label>

                <div class="flex gap-2">

                    <!-- Input -->
                    <div class="relative min-w-0 flex-1">
                        <input
                            id="member"
                            type="text"
                            value="e60c-1a6d-47a9-a854-1f048a6498da"
                            placeholder="Nhập mã, email hoặc số điện thoại"
                            class="h-13 w-full rounded-xl border-2 border-emerald-500
                                   bg-white py-3 pl-4 pr-11 text-base text-slate-800
                                   outline-none transition
                                   placeholder:text-slate-400
                                   focus:border-emerald-500
                                   focus:ring-4 focus:ring-emerald-500/10"
                        />

                        <!-- Clear -->
                        <button
                            type="button"
                            class="absolute right-3 top-1/2 -translate-y-1/2
                                   rounded-full p-1 text-slate-400
                                   transition hover:bg-slate-100 hover:text-slate-600"
                            aria-label="Xóa"
                        >
                            <svg class="h-5 w-5" viewBox="0 0 20 20"
                                 fill="currentColor">
                                <path d="M10 1.667a8.333 8.333 0 1 0 0 16.666
                                         8.333 8.333 0 0 0 0-16.666Zm3.09 10.244
                                         a.833.833 0 0 1-1.179 1.178L10
                                         11.18l-1.91 1.91a.833.833 0 1 1-1.179-1.179
                                         L8.821 10l-1.91-1.91A.833.833 0 0 1
                                         8.09 6.911L10 8.821l1.911-1.91a.833.833
                                         0 0 1 1.178 1.178L11.18 10l1.91 1.911Z"/>
                            </svg>
                        </button>
                    </div>

                    <!-- Search / Loading -->
                    <button
                        type="button"
                        class="flex h-[52px] w-[56px] shrink-0 items-center justify-center
                               rounded-xl bg-emerald-600 text-white shadow-sm
                               transition hover:bg-emerald-700
                               focus:outline-none focus:ring-4 focus:ring-emerald-500/20"
                        aria-label="Tìm thành viên"
                    >
                        <svg
                            class="h-5 w-5 animate-spin"
                            fill="none"
                            viewBox="0 0 24 24"
                        >
                            <circle
                                class="opacity-30"
                                cx="12"
                                cy="12"
                                r="9"
                                stroke="currentColor"
                                stroke-width="3"
                            />

                            <path
                                class="opacity-90"
                                fill="currentColor"
                                d="M21 12a9 9 0 0 0-9-9v3
                                   a6 6 0 0 1 6 6h3Z"
                            />
                        </svg>
                    </button>

                </div>
            </div>

            <!-- Helper -->
            <div class="mt-2 flex items-start gap-3 rounded-xl bg-sky-50 px-4 py-3
                        text-sm text-sky-700">

                <svg class="mt-0.5 h-5 w-5 shrink-0"
                     fill="none"
                     stroke="currentColor"
                     viewBox="0 0 24 24"
                     stroke-width="2">
                    <circle cx="12" cy="12" r="9"/>
                    <path stroke-linecap="round" d="M12 11v5M12 8h.01"/>
                </svg>

                <span>
                    Có thể nhập mã thành viên, email hoặc số điện thoại.
                </span>
            </div>

            <!-- Footer -->
            <div class="mt-7 flex items-center justify-end gap-3 border-t
                        border-slate-100 pt-5">

                <button
                    type="button"
                    class="rounded-xl px-5 py-3 text-sm font-semibold
                           text-slate-500 transition
                           hover:bg-slate-100 hover:text-slate-700"
                >
                    Hủy bỏ
                </button>

                <button
                    type="button"
                    class="inline-flex items-center justify-center gap-2 rounded-xl
                           bg-emerald-600 px-6 py-3 text-sm font-semibold text-white
                           shadow-sm transition
                           hover:bg-emerald-700
                           focus:outline-none focus:ring-4 focus:ring-emerald-500/20"
                >
                    <svg class="h-5 w-5"
                         fill="none"
                         stroke="currentColor"
                         viewBox="0 0 24 24"
                         stroke-width="2">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M17 21H7a2 2 0 0 1-2-2V5
                                 a2 2 0 0 1 2-2h8l4 4v12
                                 a2 2 0 0 1-2 2Z"/>
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M9 21v-7h6v7M9 3v5h5"/>
                    </svg>

                    Lưu người nhận
                </button>

            </div>

        </div>
    </div>
</div>
