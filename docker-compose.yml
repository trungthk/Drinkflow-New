services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drinkflow}
      POSTGRES_USER: ${POSTGRES_USER:-drinkflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drinkflow_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drinkflow} -d ${POSTGRES_DB:-drinkflow}" ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000 --no-reload"
    ports:
      - "8080:8000"
    volumes:
      - ./src:/var/www/html
    env_file:
      - ./src/.env
    environment:
      APP_URL: http://localhost:8080
      PHP_CLI_SERVER_WORKERS: 4
      SESSION_DRIVER: database
      SESSION_LIFETIME: 10080
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-drinkflow}
      DB_USERNAME: ${POSTGRES_USER:-drinkflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-drinkflow_secret}
      REALTIME_URL: http://realtime:3001
      REALTIME_PUBLIC_URL: http://localhost:3001
      REALTIME_INTERNAL_SECRET: ${REALTIME_INTERNAL_SECRET:-drinkflow-internal-dev}
      SOCKET_TOKEN_SECRET: ${SOCKET_TOKEN_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8000/up > /dev/null" ]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan queue:work --tries=3 --timeout=5 --sleep=1
    volumes:
      - ./src:/var/www/html
    env_file:
      - ./src/.env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-drinkflow}
      DB_USERNAME: ${POSTGRES_USER:-drinkflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-drinkflow_secret}
      REALTIME_URL: http://realtime:3001
      REALTIME_INTERNAL_SECRET: ${REALTIME_INTERNAL_SECRET:-drinkflow-internal-dev}
      SOCKET_TOKEN_SECRET: ${SOCKET_TOKEN_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
    restart: unless-stopped

  realtime:
    image: node:22-alpine
    env_file:
      - ./src/.env
    working_dir: /app
    volumes:
      - ./realtime:/app
    command: sh -c "npm install --no-audit --no-fund && npm start"
    environment:
      PORT: 3001
      SOCKET_TOKEN_SECRET: ${SOCKET_TOKEN_SECRET:-}
      REALTIME_INTERNAL_SECRET: ${REALTIME_INTERNAL_SECRET:-drinkflow-internal-dev}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    ports:
      - "3001:3001"
    restart: unless-stopped

volumes:
  postgres_data:
