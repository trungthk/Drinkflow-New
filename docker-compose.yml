services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drinkflow}
      POSTGRES_USER: ${POSTGRES_USER:-drinkflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drinkflow_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drinkflow} -d ${POSTGRES_DB:-drinkflow}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8000"
    env_file:
      - ./src/.env
    environment:
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-drinkflow}
      DB_USERNAME: ${POSTGRES_USER:-drinkflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-drinkflow_secret}
      REALTIME_URL: http://realtime:3001
      REALTIME_PUBLIC_URL: http://localhost:3001
      REALTIME_INTERNAL_SECRET: ${REALTIME_INTERNAL_SECRET:-drinkflow-internal-dev}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  realtime:
    image: node:22-alpine
    env_file:
      - ./src/.env
    working_dir: /app
    volumes:
      - ./realtime:/app
    command: sh -c "npm install --no-audit --no-fund && npm start"
    environment:
      PORT: 3001
      SOCKET_TOKEN_SECRET: ${SOCKET_TOKEN_SECRET:-}
      REALTIME_INTERNAL_SECRET: ${REALTIME_INTERNAL_SECRET:-drinkflow-internal-dev}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    ports:
      - "3001:3001"
    restart: unless-stopped

volumes:
  postgres_data:
